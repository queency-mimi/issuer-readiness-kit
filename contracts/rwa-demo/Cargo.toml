[package]
name = "sik-maker-checker-rwa-demo"
description = "DEMO-ONLY testnet token for the maker-checker demo: OpenZeppelin stellar-tokens 0.7.1 RWAToken + Pausable with one operator. Not audited, not for value."
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.91"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "25"
# Same pins as projects/token-invariants (OZ 0.7.1 is the newest release on soroban-sdk ^25). Used as
# dependencies by exact version, never copied (G-LICENCE: OZ stellar-contracts is MIT).
stellar-tokens = "=0.7.1"
stellar-macros = "=0.7.1"
stellar-contract-utils = "=0.7.1"
stellar-governance = "=0.7.1"

[dev-dependencies]
soroban-sdk = { version = "25", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
